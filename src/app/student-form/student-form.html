<form #f="ngForm" (ngSubmit)="onSubmit(f)" novalidate>

  <!-- NAME -->
  <div>
    <label>Name:</label><br>
    <input
      type="text"
      name="name"
      [(ngModel)]="student.name"
      #name="ngModel"
      required
      minlength="3"
    />

    <div *ngIf="name.invalid && (name.touched || name.dirty)">
      <small *ngIf="name.errors?.['required']" style="color:red;">
        Name is required.
      </small>
      <small *ngIf="name.errors?.['minlength']" style="color:red;">
        Minimum 3 characters required.
      </small>
    </div>
  </div>
  <br>

  <!-- EMAIL -->
  <div>
    <label>Email:</label><br>
    <input
      type="email"
      name="email"
      [(ngModel)]="student.email"
      #email="ngModel"
      required
      email
    />

    <div *ngIf="email.invalid && (email.touched || email.dirty)">
      <small *ngIf="email.errors?.['required']" style="color:red;">
        Email is required.
      </small>
      <small *ngIf="email.errors?.['email']" style="color:red;">
        Enter a valid email.
      </small>
    </div>
  </div>
  <br>

  <!-- AGE -->
  <div>
    <label>Age:</label><br>
    <input
      type="number"
      name="age"
      [(ngModel)]="student.age"
      #age="ngModel"
      required
      min="1"
    />

    <div *ngIf="age.invalid && (age.touched || age.dirty)">
      <small *ngIf="age.errors?.['required']" style="color:red;">
        Age is required.
      </small>
      <small *ngIf="age.errors?.['min']" style="color:red;">
        Age must be greater than 0.
      </small>
    </div>
  </div>
  <br>

  <!-- SUBMIT -->
  <button type="submit" [disabled]="f.invalid">
    Submit
  </button>

</form>
